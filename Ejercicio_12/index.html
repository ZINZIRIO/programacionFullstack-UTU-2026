<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header>
        <h1>Mi collecion favorita</h1>
        <p>Agrega tu videojuegos, peliculas o series favoitas aqui.</p>
    </header>
    
    <form class="container-form">
        <h2 for="">Nombre: </h2>
        <input type="text" class="nombre">
        <br>
        <h2 for="">Descripcion: </h2>
        <textarea name="" class="descripcion"></textarea>
        
        <br>

        <label for="">Tipo: </label>
        <select name="Categoria" class="categorias">
            <option value="videojuegos">Videojuego</option>
            <option value="peliculas">Película</option>
            <option value="serie">Serie</option>
        </select><br>
        <br>
        
        <label for="">Estado: </label>
        <select name="Estado" class="estados">
            <option value="pendiente" class="opcion">Pendiente</option>
            <option value="jugando" class="opcion">Jugando</option>
            <option value="terminado" class="opcion">Terminado</option>
        </select>

        <p>Elementos agregados: <span class="contador">0</span></p>
        <br>
        <h3>Cantidad a agregar: </h3>
        <input type="number" step="1" required class="cantidad"><br>
        <h3>Calificación: </h3>
        <input type="number" min="1" max="5" step="1" class="calificacion"><br>
        <h3>Url de la imagen: </h3>
        <input type="url" class="url" required>
        <button type="submit" class="agregar">Agregar</button>

        <p>Favoritos: <span class="favoritos" style="background-color: rgb(237, 237, 107);">0</span></p>
        <p>No favoritas: <span class="no-favoritas" style="background-color: rgb(228, 107, 237);">0</span></p>

        <section>
            <p>Filtros: </p>
            <button class="btn-todos">Todos</button>
            <button class="btn-videojuegos">Videojuegos</button>
            <button class="btn-peliculas">Películas</button>
            <button class="btn-series">Series</button>
            <button class="btn-favoritos">Favoritos</button>
            <button class="btn-pendientes">Pendientes</button>
            <button class="btn-en-progreso">En progreso</button>
            <button class="btn-terminados">Terminados</button>
        </section>

        <button class="cambiar-modo">Cambiar modo</button>
    </form>



    <div class="error"></div>

    <div class="tarjetas"></div>

    






    <script src="script.js" type="text/javascript"></script>

</body>
</html>
